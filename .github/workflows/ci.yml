name: Flux CI / Multi-Platform Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Verify JavaScript Syntax
      run: |
        node --check src/flux/static/local.js
        node --check src/flux/static/attention.js

    - name: Install Flux package & test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[agentic,dev]"

    - name: Run Test Suite
      run: |
        python -m pytest -q -p no:cacheprovider

    - name: Test Universal Unix Installer (Linux & macOS)
      if: runner.os != 'Windows'
      run: |
        chmod +x install.sh
        bash install.sh
        export PATH="$HOME/.local/bin:$PATH"
        flux --help

    - name: Run Empirical Agentic Benchmark
      run: |
        python benchmarks/agentic_v07_benchmark.py
