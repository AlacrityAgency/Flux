<!doctype html><html lang="fa" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/x-icon" href="/static/flux-mark.ico"><title>Flux — میز کار سازمانی</title><style>
@font-face{font-family:Peyda;src:url('/static/fonts/Peyda-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Peyda;src:url('/static/fonts/Peyda-SemiBold.woff2') format('woff2');font-weight:600 800;font-display:swap}
@font-face{font-family:Geist;src:url('/static/fonts/Geist-500.woff2') format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:Vazirmatn;src:url('/static/fonts/Vazirmatn.woff2') format('woff2');font-display:swap}

/* ---------- tokens: Alacrity black/white base + white-paper green for state ---------- */
:root{
  --font:Peyda,Vazirmatn,system-ui,sans-serif;--latin:Geist,Peyda,system-ui,sans-serif;
  --bg:#0a0a0a;--panel:#101010;--surface:#161616;--raised:#202020;
  --line:#232323;--border:#303030;--border-strong:#454545;
  --text:#f2f2ee;--muted:#a8a8a3;--faint:#8a8a85;
  --fill:#242427;--fill-line:#3c3c42;--fill-ink:#f2f2ee;--fill-sub:#a1a1aa;
  --ok:#baed91;--ok-bg:rgba(186,237,145,.11);
  --warn:#f2c46d;--warn-bg:rgba(242,196,109,.12);
  --bad:#ff9384;--bad-bg:rgba(255,147,132,.12);
  --btn:#f2f2ee;--btn-ink:#0a0a0a;
  --dot:#2a2a2a;--shadow:0 1px 0 #ffffff08 inset,0 8px 24px #0006;
  --radius:14px;color-scheme:dark
}
:root[data-theme=light]{
  --bg:#fffefb;--panel:#f6f8f2;--surface:#ffffff;--raised:#edf2ea;
  --line:#e8eee4;--border:#d9e2dc;--border-strong:#b9c8c0;
  --text:#142b25;--muted:#44594f;--faint:#5c7067;
  --fill:#e9e9e4;--fill-line:#cfcfc8;--fill-ink:#0a0a0a;--fill-sub:#52525b;
  --ok:#17543f;--ok-bg:#e1f0d6;
  --warn:#7a4f00;--warn-bg:#fbefd2;
  --bad:#a1362a;--bad-bg:#fbe4df;
  --btn:#0a0a0a;--btn-ink:#ffffff;
  --dot:#d3ddd6;--shadow:0 1px 2px #14352b14,0 6px 20px #14352b0f;color-scheme:light
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.75 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:transparent;border:1px solid var(--border);border-radius:10px;padding:6px 12px;min-height:36px;transition:background .15s,border-color .15s,color .15s}
button:hover{background:var(--raised)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent;font-weight:600}
button.primary:hover{filter:brightness(.92);background:var(--btn)}
button.ghost{border-color:transparent}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;height:100dvh;--side:clamp(232px,var(--sidebar-width,280px),440px)}
.app.collapsed{--side:68px}
.side{position:relative;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:14px 12px;gap:14px;overflow:visible}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.brand-lockup{display:flex;align-items:center;gap:10px;direction:ltr}
.mark{width:30px;height:30px;background:var(--text);-webkit-mask:url('/static/flux-mark.png') center/contain no-repeat;mask:url('/static/flux-mark.png') center/contain no-repeat}
.wordmark{font:500 24px/1 var(--latin);letter-spacing:-.02em}
.new-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;font-weight:600;border-radius:12px}
.nav{display:grid;gap:2px}
.nav-label{font-size:12px;color:var(--faint);padding:14px 12px 4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:6px 12px;border-radius:10px;color:var(--muted);text-decoration:none;cursor:pointer;position:relative}
.nav a:hover{background:var(--raised);color:var(--text)}
.nav a[aria-current=page]{background:var(--raised);color:var(--text);font-weight:600}
.nav a[aria-current=page]::before{content:"";position:absolute;inset-block:9px;inset-inline-start:-12px;width:3px;border-radius:3px;background:var(--ok)}
.nav .badge{margin-inline-start:auto;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;border-radius:99px;font-size:12px;background:var(--raised);color:var(--muted)}
.nav .badge.warn{background:var(--warn-bg);color:var(--warn)}
.recent{display:grid;gap:1px}
.recent a{min-height:34px;font-size:13px;color:var(--faint)}
.recent a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.side-resize{position:absolute;z-index:8;inset-block:0;inset-inline-end:0;width:8px;cursor:col-resize;touch-action:none;outline:none}.side-resize:after{content:"";position:absolute;inset-block:0;inset-inline-start:3px;width:2px;background:transparent;transition:background .15s}.side-resize:hover:after,.side-resize:focus-visible:after{background:var(--ok)}.collapsed .side-resize{inset-inline-end:-2px;width:10px}.resizing-sidebar,.resizing-sidebar *{cursor:col-resize!important;user-select:none!important}
.quota{display:grid;gap:7px;padding:0 6px;font-size:12px;color:var(--muted)}
.quota .row{display:flex;justify-content:space-between;gap:8px}
.quota .row b{font:500 11px var(--latin);color:var(--text)}
.quota .bar{height:4px;background:var(--raised);border-radius:4px;overflow:hidden}
.quota .bar i{display:block;height:100%;background:var(--muted)}
.collapsed .nav a span,.collapsed .nav-label,.collapsed .recent,.collapsed .quota,.collapsed .wordmark,.collapsed .new-btn span,.collapsed .nav .badge{display:none}
.collapsed .nav a{justify-content:center;padding:6px}
.collapsed .nav a[aria-current=page]::before{inset-inline-start:-12px}
.collapsed .brand{flex-direction:column;gap:12px}
.collapsed .brand-lockup{gap:0}

.main{display:grid;grid-template-rows:60px 1fr;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
.crumb small{font-weight:400;color:var(--faint)}
.proj{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;min-height:32px;padding:2px 12px;font-size:13px;font-weight:400}
.search{flex:1;max-width:380px;margin-inline:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:11px;background:var(--surface);min-height:38px;padding:0 12px;color:var(--faint);font-size:13px;cursor:text}
.search kbd{margin-inline-start:auto;font:11px var(--latin);border:1px solid var(--border);border-radius:6px;padding:0 6px;direction:ltr}
.top-actions{display:flex;align-items:center;gap:6px}
.budget-chip{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:11px;min-height:38px;padding:0 12px;font-size:13px;background:var(--surface)}
.budget-chip .mini{width:54px;height:5px;border-radius:5px;background:var(--raised);overflow:hidden;display:flex;direction:ltr}
.mini i{display:block;height:100%}
.seg-settled{background:var(--text)}.seg-reserved{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px)}
.icon-btn{width:38px;height:38px;padding:0;display:grid;place-items:center;border-color:transparent;position:relative}
.icon-btn .pip{position:absolute;top:6px;inset-inline-end:6px;min-width:16px;height:16px;border-radius:99px;background:var(--warn);color:#1a1200;font-size:10px;line-height:16px;text-align:center;font-weight:700}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--fill-ink);font-weight:700;border:1px solid var(--fill-line);flex:none}
.proto{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);border:1px dashed var(--border-strong);border-radius:99px;padding:2px 10px;min-height:28px}
.proto button{min-height:24px;padding:0 8px;font-size:12px;border:0;color:var(--text);text-decoration:underline;text-underline-offset:3px}

.content{display:grid;grid-template-columns:1fr 340px;min-height:0}
.stage{display:grid;grid-template-rows:auto 1fr auto auto;min-width:0;min-height:0;position:relative;overflow:auto}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:14px 24px 0;flex-wrap:wrap}
.stage-head h1{margin:0;font-size:20px;line-height:1.5}
.stage-head p{margin:0;font-size:13px;color:var(--muted)}
.stage-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:10px;padding:2px;gap:2px;background:var(--surface)}
.view-toggle button{border:0;min-height:30px;padding:2px 10px;display:flex;gap:6px;align-items:center;font-size:13px;border-radius:8px;color:var(--muted)}
.view-toggle button[aria-pressed=true]{background:var(--raised);color:var(--text);font-weight:600}

.dot{width:.62em;height:.62em;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.run{background:var(--text);animation:pulse 1.9s ease-out infinite}
.dot.wait{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.dot.block{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--text) 45%,transparent)}100%{box-shadow:0 0 0 .7em transparent}}

/* ---------- live org graph ---------- */
.graph-wrap{position:relative;min-height:480px;container-type:size;container-name:wrap;display:grid;place-items:center;padding:8px 16px;overflow:hidden}
.graph-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/22px 22px;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 78%);pointer-events:none}
.graph{position:relative;width:min(100cqw - 8px,(100cqh - 4px)*1000/650);aspect-ratio:1000/650;container-type:inline-size;container-name:g}
.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--border-strong);stroke-width:1.5;vector-effect:non-scaling-stroke}
.edge.ghost{stroke-dasharray:2 6;opacity:.7}
.edge.run{stroke:var(--muted);stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.edge.wait{stroke:var(--warn);stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.node{position:absolute;left:calc(var(--x)*.1%);top:calc(var(--y)/6.5*1%);width:calc(var(--w)*.1%);height:calc(var(--h)/6.5*1%);transform:translate(-50%,-50%);
  display:flex;flex-direction:column;justify-content:center;gap:.4em;padding:.7em .95em;text-align:start;
  background:var(--surface);border:1px solid var(--border);border-radius:1.15em;box-shadow:var(--shadow);
  font-size:clamp(11px,1.62cqw,15px);line-height:1.5}
.node>*{flex:none}
.node:hover{border-color:var(--border-strong)}
.node[aria-pressed=true]{border-color:var(--text);box-shadow:0 0 0 1px var(--text),var(--shadow)}
.node.fill{background:var(--fill);border-color:var(--fill-line);color:var(--fill-ink)}
.node.fill:hover{background:var(--fill);filter:brightness(1.08)}
.node.fill .sub,.node.fill .state,.node.fill .owner{color:var(--fill-sub)}
.node.fill .dot.run{background:var(--fill-ink)}
.node.ghost{background:transparent;border:1.5px dashed var(--border-strong);box-shadow:none;align-items:center;text-align:center;color:var(--muted);gap:.2em}
.node.ghost:hover{background:var(--raised)}
.node .t{display:flex;align-items:center;gap:.55em;font-weight:600;font-size:1.08em}
.node .t .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .sub{color:var(--muted);font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .chips{display:flex;gap:.4em;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.05em .65em;border:1px solid var(--border);border-radius:99px;background:var(--raised);font-size:.9em;white-space:nowrap}
.node .state{display:flex;align-items:center;gap:.5em;font-size:.92em;color:var(--muted)}
.node .money{font-size:.88em;color:var(--faint)}
.node .owner{font-weight:400;font-size:.82em;color:var(--muted);white-space:nowrap}
.node .meter{position:absolute;inset-inline:0;bottom:0;height:.32em;background:var(--raised);overflow:hidden;border-radius:0 0 1.15em 1.15em}
.node .meter i{display:block;height:100%;background:var(--muted)}
.tag{position:absolute;top:-1.05em;inset-inline-end:1em;display:inline-flex;align-items:center;gap:.4em;padding:0 .7em;border-radius:99px;font-size:.84em;font-weight:600;line-height:1.7;background:var(--warn);color:#1a1200;box-shadow:0 0 0 3px var(--bg)}
.tag.bad{background:var(--bad);color:#2a0903}
.edge-label{position:absolute;left:calc(var(--x)*.1%);top:calc(var(--y)/6.5*1%);transform:translate(-50%,-50%);font-size:clamp(10.5px,1.45cqw,13px);padding:.05em .8em;border:1px solid var(--border);border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.edge-label.wait{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--border))}

.tree{display:none;overflow:auto;padding:16px 24px;min-height:0}
.tree ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tree ol ol{padding-inline-start:22px;margin-top:10px;border-inline-start:1px solid var(--border)}
.tree button.row{width:100%;display:flex;align-items:center;gap:12px;text-align:start;padding:10px 14px;border-radius:12px;background:var(--surface);min-height:52px}
.tree button.row[aria-pressed=true]{border-color:var(--text)}
.tree .row .grow{flex:1;min-width:0}
.tree .row b{display:block}.tree .row small{color:var(--muted)}
.stage[data-view=list] .graph-wrap,.stage[data-narrow] .graph-wrap{display:none}
.stage[data-view=list] .tree,.stage[data-narrow] .tree{display:block}
.stage[data-narrow] .view-toggle{display:none}

.engine-wrap{margin:0 24px;container-type:inline-size}
.engine{border:1px solid var(--border);border-radius:14px;background:var(--surface);display:flex;align-items:stretch;overflow:hidden}
.engine-label{display:flex;align-items:center;gap:10px;padding:6px 16px;background:var(--fill);color:var(--fill-ink);font-weight:600;white-space:nowrap}
.engine-label small{display:block;color:var(--fill-sub);font-weight:400;font-size:11.5px;line-height:1.4}
.engine ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);flex:1}
.engine li{display:flex;align-items:center;gap:10px;padding:6px 14px;border-inline-start:1px solid var(--line);font-size:12.5px;color:var(--muted);min-width:0}
.engine li b{display:block;color:var(--text);font-weight:600;font-size:13px}
.engine li .ic{color:var(--faint)}
@container (max-width:720px){.engine{flex-direction:column}.engine-label{padding:8px 14px}.engine li{padding:8px 12px}}
@container (max-width:520px){.engine ul{grid-template-columns:repeat(2,1fr)}.engine li:nth-child(n+3){border-top:1px solid var(--line)}.engine li:nth-child(odd){border-inline-start:0}}

/* ---------- composer ---------- */
.composer-wrap{padding:16px 24px 16px;position:sticky;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 24%)}
.composer{max-width:860px;margin:0 auto;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:8px 10px 8px 12px;box-shadow:var(--shadow);transition:border-color .15s}
.composer:focus-within{border-color:var(--border-strong)}
.c-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--raised);border-radius:9px;padding:2px}
.seg button{border:0;min-height:28px;padding:0 12px;font-size:12.5px;border-radius:7px;color:var(--muted)}
.seg button[aria-checked=true]{background:var(--bg);color:var(--text);font-weight:600}
.target{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;min-height:28px;padding:0 6px 0 12px;font-size:12.5px;color:var(--muted)}
.target b{color:var(--text);font-weight:600}
.target button{border:0;width:22px;height:22px;min-height:22px;padding:0;display:grid;place-items:center;border-radius:50%}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;height:44px;max-height:120px;padding:9px 2px;outline:none;font-size:15px;line-height:1.7}
.composer textarea::placeholder{color:var(--faint)}
.c-bar{display:flex;align-items:center;gap:8px}
.c-hint{font-size:12px;color:var(--faint);flex:1;min-width:0;text-align:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send{width:38px;height:38px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}

/* ---------- manager's desk / inspector ---------- */
.desk{background:var(--panel);border-inline-start:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column}
.desk-head{position:sticky;top:0;z-index:2;background:var(--panel);padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.desk-head h2{margin:0;font-size:17px}
.desk-head small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:99px;font-size:12px;background:var(--raised);color:var(--muted)}
.pill.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.sec{padding:16px 18px 4px;display:grid;gap:10px}
.sec>h3{margin:0;font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:12px 14px;display:grid;gap:8px}
.card header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.stage-chip{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-weight:600}
.card h4{margin:0;font-size:14.5px;line-height:1.6}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:12.5px;color:var(--muted)}
.facts li{display:flex;gap:8px;align-items:baseline}
.facts li::before{content:"·";color:var(--faint)}
.facts li.ok{color:var(--ok)}.facts li.ok::before{content:"✓";color:var(--ok)}
.facts li.bad{color:var(--bad)}.facts li.bad::before{content:"!";color:var(--bad);font-weight:700}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.actions button{min-height:34px;font-size:13px}
.actions .primary{flex:1}
.reason{display:grid;gap:6px}
.reason label{font-size:12px;color:var(--muted)}
.reason .r{display:flex;gap:6px}
.reason input{flex:1;min-width:0;border:1px solid var(--border);background:var(--bg);border-radius:9px;min-height:34px;padding:0 10px;font-size:13px}
.card.done{background:transparent;border-style:dashed}
.card.done .res{display:flex;align-items:center;gap:8px;font-size:13px}
.card.done .res.ok{color:var(--ok)}.card.done .res.warn{color:var(--warn)}.card.done .res.bad{color:var(--bad)}
.card.done small{color:var(--faint)}
.card.blocked{border-color:color-mix(in srgb,var(--bad) 28%,var(--border))}
.budget{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:12px 14px;display:grid;gap:10px}
.bar3{height:9px;border-radius:9px;background:var(--raised);overflow:hidden;display:flex;direction:rtl}
.bar3 i{display:block;height:100%}
.b-settled{background:var(--text)}.b-reserved{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px)}
.b-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:start}
.b-grid div{font-size:12px;color:var(--muted);line-height:1.5}
.b-grid b{display:block;font-size:15px;color:var(--text);font-weight:600}
.b-grid .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:5px}
.formula{font:11.5px/1.6 var(--latin);color:var(--faint);direction:ltr;text-align:start;border-top:1px dashed var(--border);padding-top:8px}
