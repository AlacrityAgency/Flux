[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-engine"
version = "0.7.0"
authors = [{name = "XioDr"}]
description = "Flux Agentic Engine — Tree-sitter RepoMap, Plan/Act, Compiler Self-Healing, Surgical Edits, Shadow Git Checkpoints & Isolated Parallel Worktrees"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "psutil>=6.0.0",
    "tiktoken>=0.9.0",
    "playwright==1.62.0"
]

[project.scripts]
flux = "flux.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "asyncio: mark test as async coroutine"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flux = ["static/*", "static/fonts/*"]
