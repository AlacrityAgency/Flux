[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-engine"
version = "0.5.1"
authors = [{name = "XioDr"}]
description = "Flux Agentic Engine MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "psutil>=6.0.0",
    "tiktoken>=0.9.0",
    "playwright==1.62.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "asyncio: mark test as async coroutine"
]

[tool.setuptools.package-data]
flux = ["static/*", "static/fonts/*"]
